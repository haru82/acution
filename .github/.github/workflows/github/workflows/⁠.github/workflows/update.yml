name: Update Auction Listings

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 한국시간 기준 오전 6시 (UTC 21:00) 실행
  workflow_dispatch:      # 수동으로도 실행 가능 버튼 생성

permissions:
  contents: write

jobs:
  build:
    runs-runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 데이터 수집 스크립트 실행
        env:
          ONBID_API_KEY: ${{ secrets.ONBID_API_KEY }}
        run: python fetch_data.py

      - name: 변경사항 GitHub에 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git commit -m "auto: 매일 아파트 경매/공매 매물 업데이트" || exit 0
          git push
